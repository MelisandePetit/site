<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NG Façades – Façades &amp; isolation</title>
<meta name="description" content="NG Façades : création, rénovation et isolation de façades à Genève et à Lausanne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--graphite:#2B2B2A;--moutarde:#D99A1E;--chaux:#F4F2EE;--enduit:#DAD6CE;--texte-doux:#5A5853;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chaux);color:var(--graphite);font-family:"Poppins","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
main{max-width:520px;text-align:center;display:grid;justify-items:center;gap:22px}
img{height:52px;width:auto}
.baseline{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--texte-doux)}
h1{margin:6px 0 0;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:600;line-height:1.2}
p{margin:0;color:var(--texte-doux);line-height:1.6}
.contacts{display:grid;gap:6px;padding-top:22px;border-top:1px solid var(--enduit);width:100%;font-size:.95rem}
.contacts a{color:var(--graphite);text-decoration:none;font-weight:500}
.contacts a:hover{color:var(--moutarde)}
</style>
</head>
<body>
<main>
  <img src="/img/logo-couleur.svg" alt="NG Façades">
  <span class="baseline">Façades &amp; isolation · Genève · Lausanne</span>
  <h1>Notre site arrive bientôt.</h1>
  <p>En attendant, nous restons joignables pour vos projets de façade.</p>
  <div class="contacts">
    <a href="tel:+41782302841">+41 78 230 28 41</a>
    <a href="mailto:info@ngfacades.ch">info@ngfacades.ch</a>
  </div>
</main>
</body>
</html>
